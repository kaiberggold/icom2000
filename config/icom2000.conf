# Single source of truth for intercomd's runtime configuration. Install
# at /etc/icom2000.conf (or point --config at a copy elsewhere -- see
# `intercomd --help`). See docs/ARCHITECTURE.md "Configuration" for why
# these values live here instead of as literals in the source, and what
# happens if this file is missing (intercomd falls back to the exact
# values shown below, so a fresh checkout without this file installed
# behaves identically to having it installed).
#
# Format: "[section]" headers, "key = value" lines, "#"/";" comments.

[daemon]
socket_path = /run/icom2000.sock
gpio_chip = gpiochip0

# Physical GPIO lines. See docs/ARCHITECTURE.md "Pin assignments" --
# these remain provisional/unverified against real hardware.
#
# GPIO23/24/27 are reserved by the HiFiBerry Codec Zero HAT's own spec
# (green/red status LEDs, tactile button respectively) -- not available
# for anything else once that HAT is populated, hence ring_mode_line/
# hook_detect_line living on 5/6 rather than 27/23.
#
# The bell is driven via software PWM (icom::hw::Pwm, its own dedicated
# thread -- see docs/ARCHITECTURE.md "Software PWM"), not a plain digital
# on/off: pwm_period_ms is the cycle time, pwm_duty_ms how much of each
# cycle the pin is driven High when ring()ing. Default duty == period
# (100%) reproduces plain-on/off behavior exactly; lower it to make the
# bell strike/buzz gentler (and draw less current) instead.
[gpio.bell]
line = 17
pwm_period_ms = 10
pwm_duty_ms = 10

[gpio.tcm1171]
ring_mode_line = 5
polarity_line = 22
hook_detect_line = 6

# The Codec Zero's own onboard green status LED. Blinks 3 times as
# intercomd's main loop starts (see StatusLed, src/hw) -- a quick "the
# daemon came up" visual check with no console/network access needed.
# GPIO24 (the HAT's red LED) and GPIO27 (its tactile button) are reserved
# the same way but not yet wired up to anything in this project.
[gpio.status_led]
line = 23

# Station registry: the ONLY place a station name is tied to a physical/
# logical audio channel. Adding a network-based third station, or
# switching "door"/"inside" from the codec's analog crossbar to an
# independent digital capture/playback path, means editing this section
# (and the matching [station.<name>] section below) only -- see
# docs/ARCHITECTURE.md "Stations".
[stations]
names = door, inside

[station.door]
# Named ALSA PCM devices from config/asound.conf (installed as
# /etc/asound.conf) -- never a raw sound-card device string. Read by the
# ALSA audio engine, which intercomd doesn't run yet (it still uses the
# no-op engine -- see docs/ARCHITECTURE.md "Audio boundary").
capture_device = icom_door_capture
playback_device = icom_door_playback

[station.inside]
capture_device = icom_inside_capture
playback_device = icom_inside_playback
