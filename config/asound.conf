# Install at /etc/asound.conf on the Pi. Named ALSA PCM devices for
# icom2000 -- see docs/ARCHITECTURE.md "Named ALSA devices" for the full
# rationale; the short version:
#
# intercomd (and any other icom2000 code) NEVER opens a raw sound-card
# device string directly. It only ever asks for the devices named in
# config/icom2000.conf's [station.*] sections. This file is the one place
# those names meet the hardware.
#
# Layout: the Codec Zero's stereo capture and playback streams are shared
# between the two stations, one channel each:
#
#     door   = left channel  (0)
#     inside = right channel (1)
#
# icom_capture_shared (dsnoop) and icom_playback_shared (dmix) let several
# streams use the card at once -- both stations' mics and speakers, plus
# e.g. a speaker-test while intercomd runs. Each station device picks its
# channel with a `route` (ttable.<station channel>.<card channel>; mono
# playback leaves the other channel silent), and `plug` converts from
# whatever format the caller asks for.
#
# Which physical connector ends up on which channel is the mixer's job,
# set by the alsactl state restored at boot (systemd/alsa-restore-codec-zero.service):
# door's mic into the left capture channel and the left playback channel
# out to door's speaker, the same for inside on the right, and the codec's
# own analog mic-to-output paths switched off -- intercomd carries the
# audio, so leaving those on would play everything twice. The exact amixer
# commands are in docs/SMOKE_TESTS.md "S2" (the speaker terminals only hear
# the codec's right output mix, so door's left channel is crossed over to
# it inside the codec). Getting a channel backwards here or there is a
# silent, confusing bug, not a build error: S3/S4 there check each channel
# on its own.
#
# Hardware assumptions to confirm on the Pi (docs/SMOKE_TESTS.md):
#   - the card is named "Zero" (`aplay -l`); otherwise change both
#     `pcm "hw:Zero"` lines below;
#   - it runs 48 kHz, 16-bit, 2 channels -- the shared devices fix that
#     format; change `format`/`rate` below if the card needs another.

pcm.icom_capture_shared {
    type dsnoop
    # Shared-memory key: any number unique on the system. Not per user, and
    # readable by the audio group, so intercomd (running as its own user)
    # and your login user can share the card at the same time.
    ipc_key 20831
    ipc_key_add_uid false
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:Zero"
        channels 2
        rate 48000
        format S16_LE
        period_size 480
        buffer_size 1920
    }
}

pcm.icom_playback_shared {
    type dmix
    ipc_key 20832
    ipc_key_add_uid false
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:Zero"
        channels 2
        rate 48000
        format S16_LE
        period_size 480
        buffer_size 1920
    }
}

pcm.icom_door_capture {
    type plug
    slave.pcm {
        type route
        slave.pcm "icom_capture_shared"
        slave.channels 2
        ttable.0.0 1
    }
}

pcm.icom_inside_capture {
    type plug
    slave.pcm {
        type route
        slave.pcm "icom_capture_shared"
        slave.channels 2
        ttable.0.1 1
    }
}

pcm.icom_door_playback {
    type plug
    slave.pcm {
        type route
        slave.pcm "icom_playback_shared"
        slave.channels 2
        ttable.0.0 1
    }
}

pcm.icom_inside_playback {
    type plug
    slave.pcm {
        type route
        slave.pcm "icom_playback_shared"
        slave.channels 2
        ttable.0.1 1
    }
}

# The Codec Zero's own onboard MEMS microphone, for testing without an
# external mic: point a station's capture_device at this in
# /etc/icom2000.conf (see the commented-out lines there).
#
# Which ADC channel(s) the onboard mic lands on is a mixer setting, so this
# takes the average of both channels -- it hears the onboard mic wherever
# the restored mixer state puts it (Raspberry Pi's Pi-Codec repository has
# a Codec Zero "onboard mic + speaker" state file; see docs/SMOKE_TESTS.md).
# If that state puts it on both channels, the other station's capture
# device hears it too.
pcm.icom_onboard_mic_capture {
    type plug
    slave.pcm {
        type route
        slave.pcm "icom_capture_shared"
        slave.channels 2
        ttable.0.0 0.5
        ttable.0.1 0.5
    }
}
