# Install at /etc/asound.conf on the Pi. Named ALSA PCM devices for
# icom2000 -- see docs/ARCHITECTURE.md "Named ALSA devices" for the full
# rationale; the short version:
#
# intercomd (and any future icom2000 code) NEVER opens a raw sound-card
# device string directly. It only ever asks for the devices named in
# config/icom2000.conf's [station.*] sections (icom_door_capture,
# icom_door_playback, icom_inside_capture, icom_inside_playback). Today
# those are plain 1:1 aliases onto the one physical card below. When the
# planned network extension needs genuinely independent, concurrent
# per-station capture/playback (dmix for shared playback, dsnoop + route
# for per-channel capture, once more than one process/station needs the
# card at once), that change happens ENTIRELY in this file -- swap these
# `plug` aliases for `dmix`/`dsnoop`/`route` definitions. No application
# code changes, and config/icom2000.conf's device *names* don't change
# either, only what they point at.
#
# Confirm the card name on your device (`aplay -l` / `arecord -l`) before
# relying on this -- "Zero" is assumed here to match the existing
# alsactl-configured setup (see systemd/alsa-restore-codec-zero.service).
# Adjust every `slave.pcm` below if yours differs.
#
# *** Per-channel splitting is intentionally NOT done here yet. *** The
# current two-station intercom needs none of it: "door" and "inside"'s
# mic/speaker cross-routing runs entirely inside the DA7212 codec's own
# analog crossbar mixer, set once at boot via alsactl -- these PCM names
# exist today only for things intercomd itself plays/records directly
# (status sounds, a doorbell chime), not for the intercom's live audio
# path. Splitting "door" = left channel / "inside" = right channel (or
# whatever the real wiring turns out to be for Lineout) needs a `route`
# plugin per device and should be verified against
# `amixer -c Zero contents` and the DA7212 datasheet on real hardware
# first -- getting a channel index backwards here is a silent, confusing
# bug, not a build error.

pcm.icom_door_capture {
    type plug
    slave.pcm "hw:Zero"
}

pcm.icom_door_playback {
    type plug
    slave.pcm "hw:Zero"
}

pcm.icom_inside_capture {
    type plug
    slave.pcm "hw:Zero"
}

pcm.icom_inside_playback {
    type plug
    slave.pcm "hw:Zero"
}

# The Codec Zero's own onboard MEMS microphone, for testing without an
# external mic: point ONE station's capture_device at this in
# /etc/icom2000.conf (see the commented-out lines there).
#
# Which physical input the card's capture stream carries is a mixer
# setting, not something this definition can choose -- this only records
# sound from the onboard mic if the mixer state restored at boot routes
# that mic to the codec's ADC (Raspberry Pi's Pi-Codec repository has a
# Codec Zero "onboard mic + speaker" state file that does; see
# docs/SMOKE_TESTS.md). Like the station devices above it's a plain alias
# onto the card's single capture stream, so it can't be open at the same
# time as another capture device.
pcm.icom_onboard_mic_capture {
    type plug
    slave.pcm "hw:Zero"
}
